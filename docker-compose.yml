version: '3'
services:
  db:
    # image: mysql:5.7
    image: postgres:15
    platform: linux/amd64
    environment:
      TZ: Asia/Tokyo
      # MYSQL_ROOT_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_development
    volumes:
      # - mysql_data:/var/lib/mysql
      - postgres_data:/var/lib/postgresql/data
    ports:
      # - "15432:3306"      # ホスト15432 → コンテナ3306
      - "15432:5432"

  web:
    env_file:
      - .env
    build: .
    working_dir: /usr/src/app          # Dockerfile と合わせる
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec puma -C config/puma.rb -b tcp://0.0.0.0:3000"
    # command: bundle exec rails s -b 0.0.0.0 -p 3000
    tty: true
    stdin_open: true
    volumes:
      - .:/usr/src/app
      - bundle_data:/usr/local/bundle:cached
      - node_modules:/usr/src/app/node_modules
    environment:
      TZ: Asia/Tokyo
      SELENIUM_DRIVER_URL: http://chrome:4444/wd/hub
      MAILER_SENDER: "rin.910491@gmail.com"
      # MYSQL_HOST: db
      # MYSQL_USER: root
      # MYSQL_PASSWORD: password
      # MYSQL_PORT: 3306
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      - db
      - chrome

  chrome:
    image: seleniarm/standalone-chromium:121.0
    ports:
      - "4444:4444"

volumes:
  # mysql_data:
  # bundle_data:
  # node_modules:
  postgres_data:
  bundle_data:
  node_modules:
